services:
  download-guard:
    build:
      context: .
    container_name: download-guard
    environment:
      - API_KEY=${API_KEY}
      - RADARR_URL=http://radarr:7878
      - SONARR_URL=http://sonarr:8989
      - DOWNLOAD_GUARD_INTERVAL_SECONDS=${DOWNLOAD_GUARD_INTERVAL_SECONDS:-60}
      - DOWNLOAD_GUARD_DRY_RUN=${DOWNLOAD_GUARD_DRY_RUN:-false}
      - TZ=${TZ}
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped
    profiles: ["minimal", "extended", "full"]
